services:
  - type: web
    name: my-searxng
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: INSTANCE_NAME
        value: MySearch
      - key: AUTOCOMPLETE
        value: duckduckgo
      # RenderのデフォルトPORT(10000)ではなく、ベースイメージのデフォルト
      # BIND_ADDRESS(0.0.0.0:8080)にポート番号を合わせるための固定値。
      - key: PORT
        value: "8080"
      - key: BIND_ADDRESS
        value: "0.0.0.0:8080"
    healthCheckPath: /
